name: Deploy to GitHub Pages

# index.html is written for the claude.ai artifact viewer, which adds the
# doctype and viewport at publish time. This job adds them for the standalone page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone page
        run: |
          mkdir _site
          {
            echo '<!doctype html>'
            echo '<html lang="fr">'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<meta name="apple-mobile-web-app-capable" content="yes">'
            echo '<meta name="mobile-web-app-capable" content="yes">'
            echo '<meta name="apple-mobile-web-app-title" content="Faillite">'
            url='https://cyphalle.github.io/faillite-ou-revolution/'
            desc='Dix budgets pour redresser les comptes de la France. Les marchés, la rue et Bruxelles vous regardent : laissez filer la dette et c’est la faillite, serrez trop vite et c’est la révolution.'
            echo "<meta name=\"description\" content=\"$desc\">"
            echo '<meta property="og:type" content="website">'
            echo '<meta property="og:title" content="Faillite ou Révolution">'
            echo "<meta property=\"og:description\" content=\"$desc\">"
            echo "<meta property=\"og:url\" content=\"$url\">"
            echo "<meta property=\"og:image\" content=\"${url}assets/og.png\">"
            echo '<meta property="og:image:width" content="1200">'
            echo '<meta property="og:image:height" content="630">'
            echo '<meta property="og:locale" content="fr_FR">'
            echo '<meta name="twitter:card" content="summary_large_image">'
            echo '<link rel="icon" type="image/png" href="assets/icon.png">'
            echo '<link rel="apple-touch-icon" href="assets/icon.png">'
            cat index.html
          } > _site/index.html
          cp -R assets LICENSE README.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
